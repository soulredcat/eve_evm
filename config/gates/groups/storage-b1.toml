    "snapshot_preserves_height_and_payload_across_new_commit",
    "spike_refuses_preexisting_destination_or_over_budget_workload",
    "state::tests::simulated_write_or_lost_ack_fences_cache_and_writer_until_actual_reopen",
    "synced_batch_reopens_with_exact_metadata_and_payload",
    "synced_batch_survives_process_exit_without_database_destructors",
    "truncated_noncanonical_and_missing_tail_records_are_rejected",
    "whole_commit_replay_and_stale_parent_are_distinct",
    "wrong_genesis_configuration_or_schema_is_never_silently_initialized",
