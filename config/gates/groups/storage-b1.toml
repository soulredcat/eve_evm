version = 1
package = "eve-storage"
requirements = ["B0.2","B1","T-S05","T-S06"]
tests = [
    "actual_database_sequence_snapshot_keeps_both_domains_and_recovery_payload_at_one_height",
    "bad_identity_parent_height_and_missing_payload_never_advance_cursor",
    "bounded_snapshot_leases_release_after_drop",
    "bounded_spike_measures_real_sync_checkpoint_and_reopen",
    "cache_is_checked_first_and_refreshes_after_durable_publication",
    "checkpoint_reopens_at_capture_height_and_destination_is_not_overwritten",
    "checksum_missing_payload_and_partial_export_never_replace_source_or_existing_data",
    "complete_snapshot_activates_only_new_namespace_and_preserves_live_source",
    "fixed_width_storage_bytes_match_independent_golden_layout",
    "full_state_domains_payload_roots_and_marker_reopen_together",
    "full_state_sync_survives_actual_child_exit_without_destructors",
    "interrupted_capacity_limited_import_remains_inactive_and_does_not_touch_source",
