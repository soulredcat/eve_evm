version = 1
package = "eve-finality-verifier"
requirements = ["B4-EVE-application-anchor-slice", "D41"]

tests = [
    "initialization::d41_first_header_binds_actual_canonical_genesis_not_just_chain_labels",
    "initialization::unsupported_profile_genesis_never_creates_a_classical_verifier",
    "header_guards::application_width_and_native_version_fail_before_advancing_eve_history",
    "header_guards::scheduled_upgrade_stops_at_activation_without_mutating_previous_history",
    "application::real_execution_outcome_is_anchored_only_by_its_exact_certified_next_header",
    "application::network_genesis_profile_configuration_epoch_and_protocol_identity_cannot_be_substituted",
    "application::changed_roots_execution_hash_application_and_height_never_share_the_valid_anchor",
    "application::auxiliary_timestamp_and_content_digest_are_not_claimed_as_application_authenticated",
    "privacy::downstream_consumer_cannot_construct_a_verified_development_header",
    "privacy::downstream_consumer_cannot_construct_an_authenticated_application_anchor",
    "privacy::an_external_native_capability_cannot_be_injected_into_the_anchor_api",
]
