version = 1
package = "eve-state"
requirements = ["B1", "B2", "T-S01", "T-S03", "T-S04", "T-S08", "T-A06"]
tests = [
    "block_codec_roundtrips_existing_states_and_preserves_original_commit_block_wire",
    "block_codec_preserves_ordered_opaque_rows_without_execution_authority",
    "block_codec_preserves_existing_literal_header_golden_wire",
    "block_decoder_rejects_malformed_truncated_trailing_and_nonminimal_list_wire",
    "block_decoder_rejects_noncanonical_single_byte_payload_string",
    "block_codec_enforces_exact_encoded_size_and_transaction_count_boundaries",
    "block_codec_bounds_each_opaque_transaction_and_receipt_before_copying",
    "block_codec_bounds_aggregate_raw_payload_and_large_header_encoding",
    "block_codec_rejects_transaction_receipt_count_mismatch",
    "account_and_storage_inclusion_absence_proofs_match_independent_literal_roots",
    "captured_views_do_not_mix_versions_and_missing_code_is_explicit",
    "delete_recreate_and_explicit_clear_reset_storage_without_partial_parent_writes",
    "genesis_debits_bonds_without_minting_and_keeps_empty_fee_pools_absent",
    "metadata_and_single_slot_updates_preserve_untouched_slots_and_zero_deletes",
    "missing_or_mismatched_bytecode_rejects_and_system_only_change_changes_app_commitment",
    "narrow_retained_block_and_version_codec_validate_without_complete_state",
    "proof_tampering_truncation_wrong_key_and_resource_limits_reject",
    "retained_metadata_rejects_hash_roots_app_domain_and_parent_substitution",
    "stale_versions_and_budget_excess_reject_before_journal_serialization_or_apply",
    "two_hundred_fifty_six_slots_fit_declared_budget_and_next_slot_rejects",
    "whole_commit_codec_roundtrips_rejects_trailing_data_and_binds_history_outside_evm_root",
]
