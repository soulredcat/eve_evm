version = 1
package = "eve-crypto"
requirements = ["B0.7","SEC0","T-P01-subset","T-P02-subset","T-P06-subset"]
tests = [
    "tp01_deterministic_signatures_round_trip_standard_encoding",
    "tp01_maintained_openssl_checks_all_official_pure_mldsa65_cases",
    "tp01_maintained_openssl_signature_verifies_with_rustcrypto",
    "tp01_nist_mldsa65_tc31",
    "tp01_nist_mldsa65_tc32",
    "tp01_nist_mldsa65_tc33",
    "tp01_nist_mldsa65_tc34",
    "tp01_nist_mldsa65_tc35",
    "tp01_nist_mldsa65_tc36",
    "tp01_nist_mldsa65_tc37",
    "tp01_nist_mldsa65_tc38",
    "tp01_nist_mldsa65_tc39",
    "tp01_nist_mldsa65_tc40",
    "tp01_nist_mldsa65_tc41",
    "tp01_nist_mldsa65_tc42",
    "tp01_nist_mldsa65_tc43",
    "tp01_nist_mldsa65_tc44",
    "tp01_nist_mldsa65_tc45",
    "tp01_rejects_noncanonical_signature_hint_encoding",
    "tp01_rejects_truncated_or_oversized_wire_encodings",
    "tp01_rejects_wrong_seed_lengths",
    "tp01_rustcrypto_signature_verifies_with_maintained_openssl",
    "tp02_binds_both_registered_public_keys",
    "tp02_rejects_changed_identity_and_key_epoch",
    "tp02_rejects_changed_network_purpose_or_payload",
    "tp02_rejects_invalid_signature_even_when_other_component_is_valid",
    "tp02_rejects_valid_components_signed_over_different_messages",
    "tp02_requires_both_signatures_for_the_same_enrolled_identity",
    "tp06_enforces_context_and_message_budgets_before_crypto",
    "tp06_hybrid_payload_limit_preserves_the_full_key_bound_envelope",
]
