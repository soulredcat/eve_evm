[workspace]
resolver = "3"
members = [
    "xtask",
    "public/components/recovery-store",
    "validator/components/authentication",
    "validator/components/execution",
    "validator/components/consensus-comet",
    "public/components/interop",
    "validator/components/protocol-config",
    "public/components/node-policy",
    "validator/components/bridge-protocol",
    "validator/components/state",
    "tests/acceptance/state-recovery",
    "master",
]

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=0.9.8"
syn = { version = "=2.0.117", features = ["full", "visit", "extra-traits"] }
sha2 = "=0.11.0"
tempfile = "=3.27.0"
hex = "=0.4.3"
rocksdb = { version = "=0.25.0", default-features = false, features = ["bindgen-runtime"] }
ml-dsa = { version = "=0.1.1", features = ["zeroize"] }
ed25519-dalek = "=2.2.0"
revm = { version = "=43.0.3", default-features = false, features = ["std", "portable", "secp256k1"] }
alloy-primitives = { version = "=1.7.3", features = ["rlp", "serde"] }
alloy-consensus = { version = "=2.5.0", features = ["std", "k256"] }
alloy-eips = { version = "=2.5.0", default-features = false, features = ["std"] }
alloy-rlp = { version = "=0.3.16", features = ["derive"] }
alloy-trie = { version = "=0.9.8", features = ["ethereum"] }
zeroize = "=1.8.2"
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa", "std"] }
prost = "=0.14.4"
prost-build = "=0.14.4"
prost-types = "=0.14.4"
protoc-bin-vendored = "=3.2.0"
bs58 = "=0.5.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 1

[profile.test]
debug = 1
